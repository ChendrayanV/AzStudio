name: Release

# Builds and publishes a new GitHub Release automatically whenever app code changes
# land on main. Also runnable manually (workflow_dispatch) for a release with no code
# change (e.g. after only touching docs).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "AzStudio.sln"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $version = "v$date.${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build AzStudio.sln -c Release

      - name: Publish AzStudio.App (WPF, win-x64)
        run: >
          dotnet publish src/AzStudio.App/AzStudio.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/app-win-x64

      # AzStudio.Avalonia is plain net8.0 (no -windows suffix), so every RID below
      # cross-publishes cleanly from this windows-latest runner — no target OS/hardware
      # needed at build time.
      - name: Publish AzStudio.Avalonia (win-x64)
        run: >
          dotnet publish src/AzStudio.Avalonia/AzStudio.Avalonia.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/avalonia-win-x64

      - name: Publish AzStudio.Avalonia (linux-x64)
        run: >
          dotnet publish src/AzStudio.Avalonia/AzStudio.Avalonia.csproj -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/avalonia-linux-x64

      - name: Publish AzStudio.Avalonia (osx-x64)
        run: >
          dotnet publish src/AzStudio.Avalonia/AzStudio.Avalonia.csproj -c Release -r osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/avalonia-osx-x64

      - name: Publish AzStudio.Avalonia (osx-arm64)
        run: >
          dotnet publish src/AzStudio.Avalonia/AzStudio.Avalonia.csproj -c Release -r osx-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/avalonia-osx-arm64

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/assets | Out-Null
          Copy-Item dist/app-win-x64/AzStudio.exe dist/assets/AzStudio-Windows.exe
          Copy-Item dist/avalonia-win-x64/AzStudio.Avalonia.exe dist/assets/AzStudio-Windows-Avalonia.exe
          Compress-Archive -Path dist/avalonia-linux-x64/AzStudio.Avalonia -DestinationPath dist/assets/AzStudio-Linux-x64.zip
          Compress-Archive -Path dist/avalonia-osx-x64/AzStudio.Avalonia -DestinationPath dist/assets/AzStudio-macOS-x64.zip
          Compress-Archive -Path dist/avalonia-osx-arm64/AzStudio.Avalonia -DestinationPath dist/assets/AzStudio-macOS-arm64.zip

      - name: Tag and create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git tag $version
          git push origin $version
          gh release create $version (Get-ChildItem dist/assets -File | ForEach-Object { $_.FullName }) `
            --title "AzStudio $version" `
            --notes "Automated release built from commit ${{ github.sha }}.`n`nAssets: Windows (WPF), and Avalonia builds for Windows, Linux, and macOS (Intel + Apple Silicon)."
